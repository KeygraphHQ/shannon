name: Plugin documentation sync

on:
  pull_request:
    paths:
      - llms.txt
      - llms-full.txt
      - plugins/shannon/skills/shannon/references/**
      - plugins/shannon/scripts/sync-docs.sh
      - .github/workflows/plugin-docs-check.yml
  push:
    branches: [main]
    paths:
      - llms.txt
      - llms-full.txt
      - plugins/shannon/skills/shannon/references/**
      - plugins/shannon/scripts/sync-docs.sh
      - .github/workflows/plugin-docs-check.yml

permissions:
  contents: read

jobs:
  check:
    name: Check bundled documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compare bundled docs with root originals
        run: bash plugins/shannon/scripts/sync-docs.sh --check
